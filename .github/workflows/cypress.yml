name: Cypress Assignment Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cypress-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Cypress Assignment
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          spec: cypress/e2e/assignment.cy.js