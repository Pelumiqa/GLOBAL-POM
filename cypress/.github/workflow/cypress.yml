name: Cypress Automation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cypress-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Cypress Tests
        uses: cypress-io/github-action@v7
        with:
          browser: chrome
          spec: |
            cypress/e2e/globalfixtureass.cy.js
            cypress/e2e/automationExercise.cy.js